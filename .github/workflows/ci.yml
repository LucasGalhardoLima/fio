name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm vitest run --reporter=verbose packages/api/tests/unit packages/sdk/tests packages/shared/tests
        env:
          NODE_ENV: test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fio
          POSTGRES_PASSWORD: fio_test
          POSTGRES_DB: fio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm tsx packages/api/scripts/migrate.ts
        env:
          DATABASE_URL: postgresql://fio:fio_test@localhost:5432/fio_test

      - name: Run integration tests
        run: pnpm vitest run --reporter=verbose packages/api/tests/integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://fio:fio_test@localhost:5432/fio_test
          REDIS_URL: redis://localhost:6379

  security-tests:
    name: Security Tests (Malicious Personas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fio
          POSTGRES_PASSWORD: fio_test
          POSTGRES_DB: fio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm tsx packages/api/scripts/migrate.ts
        env:
          DATABASE_URL: postgresql://fio:fio_test@localhost:5432/fio_test

      - name: Run security tests
        run: pnpm vitest run --reporter=verbose packages/api/tests/security
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://fio:fio_test@localhost:5432/fio_test
          REDIS_URL: redis://localhost:6379

      - name: Verify security test coverage
        run: |
          echo "Verifying security test coverage thresholds..."
          SECURITY_TESTS=$(pnpm vitest run --reporter=json packages/api/tests/security 2>/dev/null | jq '.numTotalTests')
          echo "Total security tests: $SECURITY_TESTS"
          if [ "$SECURITY_TESTS" -lt 35 ]; then
            echo "❌ FAILED: Security test count ($SECURITY_TESTS) is below minimum threshold (35)"
            echo "Required: 35 baseline security tests across all personas"
            exit 1
          fi
          echo "✅ PASSED: Security test coverage meets minimum threshold"

      - name: Security gate summary
        if: always()
        run: |
          echo "### 🔒 Security Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Persona | Tests | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Webhook Forger | Signature validation | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Replay Attacker | Idempotency enforcement | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Abuse Actor | Rate limiting | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Credential Thief | Auth isolation | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Internal Misuse | Privilege escalation | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Baseline: 35+ security tests required** | [View Persona Spec](./packages/api/tests/security/MALICIOUS_PERSONAS.md)" >> $GITHUB_STEP_SUMMARY

  docs-examples:
    name: Documentation Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate documentation code examples
        run: pnpm vitest run --reporter=verbose packages/docs/tests

      - name: Build docs site
        run: pnpm --filter @fio-pay/docs build
